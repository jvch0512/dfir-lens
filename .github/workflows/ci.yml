name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - name: Sample report is up to date
        run: |
          node dist/src/cli.js analyze examples/win-security.jsonl examples/auth.log examples/access.log --year 2026 > /tmp/r.md || test $? -eq 1
          diff /tmp/r.md docs/sample-report.md
