name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - name: Sample report is up to date
        run: |
          node dist/src/cli.js analyze examples/win-security.jsonl examples/auth.log examples/access.log --year 2026 > /tmp/r.md || test $? -eq 1
          diff /tmp/r.md docs/sample-report.md
